name: Doc-compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Documentatierepo zonder code: alleen de structuurcheck uit
  # DOCUMENTATION-STANDARD.md (README.md en CONTRIBUTING.md aanwezig).
  docs:
    uses: security-commons-nl/.github/.github/workflows/doc-compliance.yml@main
    with:
      require-gebruik: false
      require-architectuur: false
      require-configuratie: false
